[project]
name = "murzins-telegram-mcp"
version = "0.1.0"
description = "Персональный MCP-сервер Telegram: чтение и поиск по чатам, работа с ботами"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.45",
    "mcp>=2.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.1",
    "dependency-injector>=4.42",
    "typer>=0.15",
]

[project.scripts]
murzins-telegram-mcp = "app.main:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "settings"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "settings", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "TC", "PT", "RET", "PTH", "TRY", "ERA", "ARG", "DTZ", "S"]
ignore = ["RUF001", "RUF002", "RUF003", "TRY003", "S101", "N818", "ANN401", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "settings"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "ARG", "S105", "S106", "S603", "S607", "DTZ001"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.mypy]
python_version = "3.12"
packages = ["app", "settings"]
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["telethon.*", "dependency_injector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
